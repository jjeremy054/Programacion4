<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <form action="ejercicio1.php" method="post">
        <fieldset class="container bg-primary text-white text-center rounded">
            <legend class="container bg-success">Datos Personales:</legend>
             <label for="txtnombre">Nombre:</label>
             <input type="text" id="txtnombre" name="txtnombre" required placeholder="ingrese nombre"><br>
             <label for="txtapellido">Apellido:</label>
             <input type="text" id="txtapellido" name="txtapellido" required placeholder="ingrese Apellido"><br>
             <label for="txtcedula">Cedula de Identidad:</label>
             <input type="number" id="txtcedula" name="txtcedula" required placeholder="ingrese cedula" max="10000000" min="3000000"><br>
             <label for="txtcelular">Numero de celular:</label>
             <select name="txtcelu" id="txtcelu">
                   <option value="+595">+595</option>
                   <option value="+234">+234</option>
                   <option value="+545">+545</option>
                   <option value="+55">+55</option>
                   <option value="+1">+1</option>
             </select>
             <input type="number" id="txtcelular" name="txtcelular" required placeholder="ingrese numero">  <br>
            <label for="txtemail">Email:</label>
            <input type="text" id="txtemail" name="txtemail" required ><br>
            <label for="txtfecha">fecha de nacimiento:</label>
            <input type="date" id="txtfecha" name="txtfecha" required><br><br>
            <input type="submit" value="ENVIAR" id="btnenviar" name="btnenviar" class="btn btn-success">
            <input type="reset" value="BORRAR" id="btnborrar" name="btnborrar" class="btn bg-danger">
        </fieldset>
    </form>
</body>
</html>
